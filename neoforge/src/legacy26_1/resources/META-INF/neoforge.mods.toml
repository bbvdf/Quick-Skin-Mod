# NeoForge mod metadata for QuickSkin
modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"
issueTrackerURL = "https://github.com/The-Plum-Team/Quick-Skin-Mod/issues"

[[mods]]
modId = "onlineskins"
version = "${version}"
displayName = "Quick Skin"
displayTest = "IGNORE_ALL_VERSION"
authors = "The Plum Team"
description = '''
Change, preview, and synchronize local skins, capes, and CPM models in-game across Fabric and NeoForge.
'''
displayURL = "https://modrinth.com/mod/quick-skin"
logoFile = "icon.png"

[[mixins]]
config = "onlineskins-neoforge.mixins.json"

[[mixins]]
config = "onlineskins-ears.mixins.json"

# NeoForge never reads onlineskins.mixins.json; the nickname mixins live in common
[[mixins]]
config = "onlineskins-nicknames.mixins.json"

# Hidden armour: the server's equipment filter and the local player's own draw (ADR 0017)
[[mixins]]
config = "onlineskins-armor.mixins.json"

# The favourites fan: the mouse points at its cards instead of turning the camera
[[mixins]]
config = "onlineskins-input.mixins.json"

# The menus: the game's toasts wait while one is shown
[[mixins]]
config = "onlineskins-menu.mixins.json"

# Sharing the account skin with vanilla clients: the server accessors (ADR 0012)
[[mixins]]
config = "onlineskins-account-skin.mixins.json"

[[mixins]]
config = "onlineskins-architectury-26_1-compat.mixins.json"

[[dependencies.onlineskins]]
modId = "neoforge"
type = "required"
versionRange = "[21.11,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.onlineskins]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.11,1.21.12)"
ordering = "NONE"
side = "BOTH"

[[dependencies.onlineskins]]
modId = "architectury"
type = "required"
versionRange = "[19.0.1,)"
ordering = "AFTER"
side = "BOTH"
